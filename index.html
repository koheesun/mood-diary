<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 기분</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F6F3FF;--bg2:#EDE8FF;--card:#FFFFFF;--tile:#F8F6FF;--ink:#2E2A4D;--sub:#8F8AAE;--line:#ECE8FA;--soft:#EFEBFF;--pri:#7B61F2;--pri2:#9B87FF;--sh:0 8px 24px rgba(123,97,242,.10);
  --m0:#FF8FA3;--m1:#FFCB45;--m2:#FFE6A1;--m3:#86AEFF;--m4:#B8A5F5;--eye:#4A3F5E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1930;--bg2:#221F3B;--card:#272440;--tile:#2E2A4C;--ink:#EEEBFF;--sub:#A5A1C8;--line:#3A3659;--soft:#35315A;--pri:#8E7AF5;--sh:0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#1B1930;--bg2:#221F3B;--card:#272440;--tile:#2E2A4C;--ink:#EEEBFF;--sub:#A5A1C8;--line:#3A3659;--soft:#35315A;--pri:#8E7AF5;--sh:0 8px 24px rgba(0,0,0,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:440px;margin:0 auto;min-height:100dvh}
.screen{padding:18px 16px 120px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,#D9CFFF,#B9A8FF);display:grid;place-items:center;flex:none}
.top h1{font-size:1.55rem;font-weight:700;margin:0;line-height:1.25}
.top p{margin:0;color:var(--sub);font-size:.88rem}
.top .ic{margin-left:auto;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ttl{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:14px;text-align:center}
.ttl h1{font-size:1.2rem;font-weight:700;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:18px;padding:5px;margin-bottom:16px;box-shadow:var(--sh)}
.seg button{padding:9px 0;border-radius:14px;color:var(--sub);font-weight:500}
.seg button.on{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 4px 12px rgba(123,97,242,.35)}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:1.05rem;font-weight:700;margin:0 0 6px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav h2{font-size:1.1rem;font-weight:700;margin:0}
.arrow{width:36px;height:36px;border-radius:50%;font-size:1.3rem;color:var(--sub)}
.arrow:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .w{color:var(--sub);font-size:.82rem;padding:6px 0}
.day{min-height:60px;border-radius:14px;background:var(--tile);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;font-size:.88rem;font-weight:500}
.day svg{width:30px;height:30px}
.day.sel{background:linear-gradient(160deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 4px 12px rgba(123,97,242,.4)}
.day.today:not(.sel) span{color:var(--pri);font-weight:700}
.day:disabled{opacity:.4;cursor:default}
.sum{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--soft);border-radius:22px;padding:14px 18px;margin-bottom:14px}
.sum svg{width:50px;height:50px}
.sum small{display:block;color:var(--sub);font-size:.85rem}
.sum b{font-size:1.15rem}
.sum .go{margin-left:auto;color:var(--pri);font-size:1.4rem}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50vw - 204px));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;font-size:2rem;line-height:1;box-shadow:0 8px 18px rgba(123,97,242,.45)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(123,97,242,.10);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--sub)}
.tabs button.on{color:var(--pri);font-weight:700}
.pill{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:18px;padding:4px;margin-bottom:14px}
.pill button{padding:8px 0;border-radius:14px;color:var(--sub);font-weight:500}
.pill button.on{background:var(--card);color:var(--pri);font-weight:700;box-shadow:0 2px 8px rgba(123,97,242,.15)}
.hap{display:flex;align-items:center;gap:20px;margin:10px 0 14px}
.hap svg{width:88px;height:88px;flex:none}
.hap small{color:var(--sub)}
.hap .big{font-size:2.6rem;font-weight:700;line-height:1.1}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:10px;border-bottom:1px solid var(--line)}
.bars i{flex:1;border-radius:10px 10px 0 0;display:block;max-width:26px;margin:0 auto}
.bl{display:flex;gap:10px;color:var(--sub);font-size:.82rem;margin-top:6px}
.bl span{flex:1;text-align:center}
.dist{display:flex;align-items:center;gap:22px;margin-top:10px}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:28px;border-radius:50%;background:var(--card)}
.lg{flex:1;display:grid;gap:7px}
.lg div{display:flex;align-items:center;gap:8px;font-size:.9rem}
.lg i{width:11px;height:11px;border-radius:50%}
.lg b{margin-left:auto;font-weight:500}
.msg{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.msg h3{color:var(--pri);font-size:.95rem;font-weight:700;margin:0 0 2px}
.msg p{margin:0;font-size:.92rem}
.msg svg{width:84px;height:64px;flex:none;margin-left:auto}
.mh{font-size:1.1rem;font-weight:700;margin:4px 0 12px}
.item{display:grid;grid-template-columns:58px 1fr;width:100%;text-align:left;background:var(--card);border-radius:20px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.item .dt{background:var(--soft);text-align:center;padding-top:14px}
.item .dt b{display:block;font-size:1.35rem;font-weight:700;line-height:1.1}
.item .dt small{color:var(--sub)}
.item .bd{display:flex;gap:11px;align-items:center;padding:12px;min-width:0}
.item .bd>svg{width:38px;height:38px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{font-size:.98rem}
.item .tx p{margin:0;color:var(--sub);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.item img{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tg span{font-size:.72rem;background:var(--soft);border-radius:8px;padding:0 7px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:44px 0}
.rec{position:fixed;inset:0;z-index:10;background:linear-gradient(180deg,var(--bg),var(--bg2));overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.rec>div{max-width:440px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.rh{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;text-align:center}
.rh h2{font-size:1.1rem;font-weight:700;margin:0}
.rh .ok{color:var(--pri);text-align:right;font-weight:700}
.q{text-align:center;font-size:1.35rem;font-weight:700;margin:14px 0 4px}
.stage{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fw{position:relative;width:190px;height:190px;display:grid;place-items:center}
.fw .rays{position:absolute;inset:-10px;width:210px;height:210px}
.fw .f{width:150px;height:150px;position:relative}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--card);border-radius:22px;padding:10px 6px;margin-bottom:16px;box-shadow:var(--sh)}
.picks button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:15px;font-size:.7rem;color:var(--sub);border:2px solid transparent}
.picks button svg{width:40px;height:40px}
.picks button.on{border-color:var(--pri);background:var(--soft);color:var(--ink);font-weight:700}
textarea{width:100%;min-height:96px;resize:none;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;padding:14px}
.cnt{text-align:right;color:var(--sub);font-size:.8rem}
.lbl{font-weight:700;margin:16px 0 8px}
.lbl small{color:var(--sub);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:16px;padding:6px 15px;font-weight:500}
.chip.on{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.addrow input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font:inherit;width:150px}
.photo{display:block;width:100%;border:2px dashed #CFC6F5;border-radius:20px;padding:18px;color:var(--sub);text-align:center;cursor:pointer;background:var(--card)}
.photo img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}
.photo .i{color:var(--pri);width:28px;height:28px}
.save{width:100%;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:20px;padding:15px;font-weight:700;font-size:1.05rem;margin-top:20px;box-shadow:0 8px 18px rgba(123,97,242,.4)}
.del{display:block;margin:14px auto 0;color:var(--sub);text-decoration:underline;font-size:.9rem}.del.warn{color:#E8344F;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:22px;z-index:20;font-size:.9rem}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="g0" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#FFC4CE"/><stop offset="1" stop-color="#FF8FA3"/></radialGradient>
<radialGradient id="g1" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#FFE68A"/><stop offset="1" stop-color="#FFC63D"/></radialGradient>
<radialGradient id="g2" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFE29A"/></radialGradient>
<radialGradient id="g3" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#C4D8FF"/><stop offset="1" stop-color="#86AEFF"/></radialGradient>
<radialGradient id="g4" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#DCD0FF"/><stop offset="1" stop-color="#B8A5F5"/></radialGradient>
</defs></svg>
<div class="app"><main class="screen" id="screen"></main></div>
<div class="tabs" id="tabs"><div id="tabin"></div></div>
<div class="rec" id="rec" hidden></div>

<script>
const L=["최고예요","행복해요","보통이에요","우울해요","힘들어요"];
const DOW=["일","월","화","수","목","금","토"];
const BASE=["업무","운동","맛있는거","휴식","여행","기타"];
const K2="mood-diary-v2";
let DB={entries:{},tags:[]};
try{const raw=localStorage.getItem(K2);try{DB=JSON.parse(raw)||DB}catch(e){if(raw)localStorage.setItem(K2+"-corrupt",raw)}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem(K2,JSON.stringify(DB));return true}catch(e){return false}};
const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const now=new Date(),TODAY=iso(now.getFullYear(),now.getMonth(),now.getDate());
const S={tab:"cal",y:now.getFullYear(),m:now.getMonth(),sel:TODAY,stat:"m",draft:null,adding:false,arm:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse=k=>k.split("-").map(Number);
const dlabel=k=>{const[y,m,d]=parse(k);return m+"월 "+d+"일 ("+DOW[new Date(y,m-1,d).getDay()]+")"};
const ent=k=>DB.entries[k]&&typeof DB.entries[k].m==="number"?DB.entries[k]:null;
const P={cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/>',bar:'<path d="M5 20v-7M12 20V5M19 20v-10"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};
const ico=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';

function face(i,s){
  const st='fill="none" stroke="var(--eye)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
  const dots='<circle cx="35" cy="47" r="4.5" fill="var(--eye)"/><circle cx="65" cy="47" r="4.5" fill="var(--eye)"/>';
  const heart=x=>'<path transform="translate('+x+' 47) scale(1.3)" fill="#E8344F" d="M0 5C-9-3-9-10-4-10c2 0 3.5 1 4 3 .5-2 2-3 4-3 5 0 5 7-4 15z"/>';
  const f=[
    heart(33)+heart(67)+'<path d="M38 62Q50 76 62 62Z" fill="#fff" stroke="var(--eye)" stroke-width="3" stroke-linejoin="round"/>',
    '<path d="M27 50Q34 41 42 50M58 50Q66 41 73 50" '+st+'/><path d="M37 62Q50 77 63 62" '+st+'/>',
    dots+'<path d="M41 64Q50 70 59 64" '+st+'/>',
    dots+'<path d="M28 38L40 41M72 38L60 41" '+st+' stroke-width="3"/><path d="M39 71Q50 61 61 71" '+st+'/>',
    '<path d="M27 47Q34 54 42 47M58 47Q66 54 73 47" '+st+'/><path d="M38 73Q44 65 50 73T62 73" '+st+'/><path d="M31 58q-5 8 0 11 5-3 0-11zM69 58q-5 8 0 11 5-3 0-11z" fill="#6FA8F7"/>'
  ][i];
  return '<svg viewBox="0 0 100 100" width="'+s+'" height="'+s+'" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="url(#g'+i+')"/><ellipse cx="32" cy="22" rx="14" ry="7" fill="#fff" opacity=".4" transform="rotate(-25 32 22)"/><ellipse cx="22" cy="62" rx="8" ry="5" fill="#FF8FA3" opacity=".5"/><ellipse cx="78" cy="62" rx="8" ry="5" fill="#FF8FA3" opacity=".5"/>'+f+'</svg>';
}
const mascot='<svg viewBox="0 0 84 64" aria-hidden="true"><path d="M10 52Q2 36 18 30Q20 12 40 16Q60 8 66 30Q82 34 72 52Z" fill="#fff" stroke="#D4C9FA" stroke-width="2"/><circle cx="32" cy="38" r="2.4" fill="#4A3F5E"/><circle cx="50" cy="38" r="2.4" fill="#4A3F5E"/><path d="M37 43Q41 47 45 43" fill="none" stroke="#4A3F5E" stroke-width="2" stroke-linecap="round"/><path transform="translate(70 18) scale(.9)" fill="#FF8FA3" d="M0 5C-9-3-9-10-4-10c2 0 3.5 1 4 3 .5-2 2-3 4-3 5 0 5 7-4 15z"/></svg>';

function shift(d){
  if(S.tab==="stat"&&S.stat==="y"){S.y=Math.min(S.y+d,now.getFullYear());return}
  let m=S.m+d,y=S.y;if(m<0){m=11;y--}if(m>11){m=0;y++}
  if(y>now.getFullYear()||(y===now.getFullYear()&&m>now.getMonth()))return;
  S.m=m;S.y=y;
}
const atNow=()=>S.y===now.getFullYear()&&((S.tab==="stat"&&S.stat==="y")||S.m===now.getMonth());
const nav=t=>'<div class="mnav"><button class="arrow" data-act="shift" data-d="-1" aria-label="이전">‹</button><h2>'+t+'</h2><button class="arrow" data-act="shift" data-d="1" aria-label="다음"'+(atNow()?" disabled":"")+'>›</button></div>';
const seg=()=>'<div class="seg">'+[["cal","달력"],["stat","통계"],["list","기록"]].map(a=>'<button class="'+(S.tab===a[0]?"on":"")+'" data-act="tab" data-v="'+a[0]+'">'+a[1]+'</button>').join("")+'</div>';

function vCal(){
  const first=new Date(S.y,S.m,1).getDay(),n=new Date(S.y,S.m+1,0).getDate();
  let g=DOW.map(d=>'<div class="w">'+d+'</div>').join("")+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){
    const k=iso(S.y,S.m,d),e=ent(k);
    g+='<button class="day'+(k===S.sel?" sel":"")+(k===TODAY?" today":"")+'" data-act="pick" data-k="'+k+'"'+(k>TODAY?" disabled":"")+' aria-label="'+dlabel(k)+(e?" "+L[e.m]:"")+'"><span>'+d+'</span>'+(e?face(e.m,30):"")+'</button>';
  }
  const e=ent(S.sel);
  const sum=e?'<button class="sum" data-act="edit" data-k="'+S.sel+'">'+face(e.m,50)+'<div><small>'+dlabel(S.sel)+'의 기분은</small><b>'+L[e.m]+'!</b></div><span class="go">›</span></button>'
    :'<button class="sum" data-act="edit" data-k="'+S.sel+'"><div><small>'+dlabel(S.sel)+'</small><b>아직 기록이 없어요</b></div><span class="go">기록하기 ›</span></button>';
  return '<div class="top"><div class="logo">'+face(1,40)+'</div><div><h1>오늘의 기분</h1><p>매일의 기분을 기록해요 💜</p></div><button class="ic" data-act="theme" aria-label="화면 모드 바꾸기">'+ico("gear")+'</button></div>'
   +seg()+'<div class="card">'+nav(S.y+"년 "+(S.m+1)+"월")+'<div class="cal">'+g+'</div></div>'+sum
   +'<button class="fab" data-act="edit" data-k="'+(S.sel<=TODAY?S.sel:TODAY)+'" aria-label="기록하기">+</button>';
}

function period(){
  const ks=Object.keys(DB.entries).filter(ent);
  if(S.stat==="m")return ks.filter(k=>k.startsWith(S.y+"-"+pad(S.m+1)));
  if(S.stat==="y")return ks.filter(k=>k.startsWith(S.y+"-"));
  return ks;
}
function vStat(){
  const ks=period(),tot=ks.length,c=[0,0,0,0,0];
  ks.forEach(k=>c[DB.entries[k].m]++);
  const good=c[0]+c[1],pct=tot?Math.round(good/tot*100):0;
  const wd=[0,0,0,0,0,0,0],wc=[0,0,0,0,0,0,0];
  ks.forEach(k=>{const[y,m,d]=parse(k),w=new Date(y,m-1,d).getDay();wd[w]+=4-DB.entries[k].m;wc[w]++});
  const bars=wd.map((s,i)=>{if(!wc[i])return'<i style="height:6%;background:var(--soft)"></i>';
    const a=s/wc[i];return'<i style="height:'+Math.max(14,(a+1)/5*100)+'%;background:var(--m'+Math.min(4,Math.max(0,Math.round(4-a)))+')"></i>'}).join("");
  let acc=0;const sg=tot?c.map((v,i)=>{const a=acc/tot*360;acc+=v;return"var(--m"+i+") "+a+"deg "+(acc/tot*360)+"deg"}).join(","):"var(--soft) 0 360deg";
  const lg=c.map((v,i)=>'<div><i style="background:var(--m'+i+')"></i>'+L[i]+'<b>'+(tot?Math.round(v/tot*100):0)+'%</b></div>').join("");
  const title=S.stat==="m"?"이번 달은 어땠을까요?":S.stat==="y"?"올해는 어땠을까요?":"지금까지는 어땠을까요?";
  const msg=!tot?"기록을 남기면 여기에 통계가 쌓여요.":pct>=50?"이번에도 수고했어요!<br>행복한 날이 더 많았네요 😊":"힘든 날도 있었지만 잘 버텼어요.<br>수고했어요 💜";
  const pill=[["m","월간"],["y","연간"],["a","전체"]].map(a=>'<button class="'+(S.stat===a[0]?"on":"")+'" data-act="stat" data-v="'+a[0]+'">'+a[1]+'</button>').join("");
  return '<div class="ttl"><span></span><h1>통계</h1><span></span></div><div class="pill">'+pill+'</div>'
   +'<div class="card">'+(S.stat!=="a"?nav(S.stat==="m"?S.y+"년 "+(S.m+1)+"월":S.y+"년"):"")+'<h3>'+title+'</h3><div class="hap">'+face(tot?(pct>=50?1:3):2,88)
   +'<div><small>행복한 날</small><div class="big">'+pct+'<span style="font-size:1.3rem">%</span></div><small>'+good+'일 / '+tot+'일 기록</small></div></div>'
   +'<div class="bars">'+bars+'</div><div class="bl">'+DOW.map(d=>'<span>'+d+'</span>').join("")+'</div></div>'
   +'<div class="card"><h3>기분 분포</h3><div class="dist"><div class="donut" style="background:conic-gradient('+sg+')"></div><div class="lg">'+lg+'</div></div></div>'
   +'<div class="msg"><div><h3>✦ 이번 기간의 한마디</h3><p>'+msg+'</p></div>'+mascot+'</div>';
}

function vList(){
  const pre=S.y+"-"+pad(S.m+1);
  const ks=Object.keys(DB.entries).filter(k=>k.startsWith(pre)&&ent(k)).sort().reverse();
  const items=ks.map(k=>{const e=DB.entries[k],d=parse(k)[2],w=DOW[new Date(S.y,S.m,d).getDay()];
    return '<button class="item" data-act="edit" data-k="'+k+'"><div class="dt"><b>'+d+'</b><small>'+w+'</small></div><div class="bd">'+face(e.m,38)
     +'<div class="tx"><b>'+L[e.m]+'</b>'+(e.n?'<p>'+esc(e.n)+'</p>':"")+((e.tags||[]).length?'<div class="tg">'+e.tags.map(t=>'<span>#'+esc(t)+'</span>').join("")+'</div>':"")+'</div>'
     +(e.photo?'<img src="'+e.photo+'" alt="첨부 사진">':"")+'</div></button>'}).join("");
  return '<div class="ttl"><span></span><h1>기록</h1><button data-act="tab" data-v="cal" aria-label="달력 보기">'+ico("cal")+'</button></div>'+nav(S.y+"년 "+(S.m+1)+"월")
   +(items||'<div class="empty">이 달에는 아직 기록이 없어요.<br>오늘의 기분을 남겨보세요.</div>')+acctCard()+'<div class="card"><h3>내 기록 백업</h3><p style="margin:0 0 10px;color:var(--sub);font-size:.88rem">기록은 이 브라우저에 저장돼요. 가끔 파일로 내보내 두면 기기를 바꾸거나 데이터가 지워져도 안전해요.</p><div style="display:flex;gap:8px"><button class="chip on" data-act="export">내보내기</button><label class="chip" style="cursor:pointer">불러오기<input type="file" id="imp" accept="application/json,.json" hidden></label></div></div>'
   +'<button class="fab" data-act="edit" data-k="'+TODAY+'" aria-label="기록하기">+</button>';
}

function render(){
  $("screen").innerHTML=S.tab==="cal"?vCal():S.tab==="stat"?vStat():vList();
  $("tabin").innerHTML=[["cal","달력"],["stat","통계"],["list","기록"]].map(a=>'<button class="'+(S.tab===a[0]?"on":"")+'" data-act="tab" data-v="'+a[0]+'">'+ico({cal:"cal",stat:"bar",list:"list"}[a[0]])+a[1]+'</button>').join("");
}

function vRec(pop){
  const sc=$("rec").scrollTop,d=S.draft,tags=BASE.concat(DB.tags);
  const picks=L.map((t,i)=>'<button data-act="mood" data-i="'+i+'" class="'+(d.m===i?"on":"")+'" aria-pressed="'+(d.m===i)+'">'+face(i,40)+t+'</button>').join("");
  const chips=tags.map(t=>'<button class="chip'+(d.tags.includes(t)?" on":"")+'" data-act="tag" data-t="'+esc(t)+'">#'+esc(t)+'</button>').join("")
    +(S.adding?'<span class="addrow"><input id="newtag" maxlength="8" placeholder="태그 입력 후 Enter"></span>':'<button class="chip" data-act="addtag" aria-label="태그 추가">+</button>');
  const rays='<svg class="rays" viewBox="0 0 210 210" aria-hidden="true"><g stroke="var(--m'+d.m+')" stroke-width="6" stroke-linecap="round" fill="none"><path d="M38 52l-14-12M62 28l-6-16M22 80l-16-3M172 52l14-12M148 28l6-16M188 80l16-3"/></g></svg>';
  $("rec").innerHTML='<div><div class="rh"><button data-act="close" aria-label="닫기" style="font-size:1.8rem;text-align:left">‹</button><h2>기분 기록하기</h2><button class="ok" data-act="save">완료</button></div>'
   +'<h3 class="q">'+(d.k===TODAY?"오늘은 어땠나요?":dlabel(d.k)+"은 어땠나요?")+'</h3>'
   +'<div class="stage"><button class="arrow" data-act="cyc" data-d="-1" aria-label="이전 기분">‹</button><div class="fw">'+rays+'<span class="f '+(pop?"pop":"")+'">'+face(d.m,150)+'</span></div><button class="arrow" data-act="cyc" data-d="1" aria-label="다음 기분">›</button></div>'
   +'<div class="picks" role="group" aria-label="기분 선택">'+picks+'</div>'
   +'<textarea id="note" maxlength="200" placeholder="오늘의 한마디를 남겨보세요 :)" aria-label="한마디">'+esc(d.n)+'</textarea><div class="cnt"><span id="cnt">'+d.n.length+'</span> / 200</div>'
   +'<div class="lbl">추가 정보 <small>(선택사항)</small></div><div class="chips">'+chips+'</div>'
   +'<div class="lbl">사진을 첨부해요 <small>(선택사항)</small></div>'
   +'<label class="photo">'+(d.photo?'<img src="'+d.photo+'" alt="첨부 사진">':ico("cam")+'<br>사진 추가')+'<input type="file" id="file" accept="image/*" hidden></label>'
   +(d.photo?'<button class="del" data-act="rmphoto">사진 지우기</button>':"")
   +'<button class="save" data-act="save">저장하기</button>'
   +(ent(d.k)?'<button class="del'+(S.arm?" warn":"")+'" data-act="del">'+(S.arm?"정말 삭제할까요? 한 번 더 눌러주세요":"이 날 기록 지우기")+'</button>':"")+'</div>';
  $("rec").scrollTop=sc;if(S.adding)$("newtag").focus();
}
function openRec(k){
  const e=DB.entries[k];
  S.draft={k:k,m:e&&typeof e.m==="number"?e.m:1,n:(e&&e.n)||"",tags:((e&&e.tags)||[]).slice(),photo:(e&&e.photo)||""};
  S.adding=false;S.arm=false;$("rec").hidden=false;document.body.style.overflow="hidden";vRec(false);
}
function closeRec(){$("rec").hidden=true;document.body.style.overflow="";S.draft=null;render()}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,d=S.draft;
  if(a==="tab"){S.tab=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==="export"){exportData()}
  else if(a==="theme"){const r=document.documentElement,dk=(r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";r.dataset.theme=dk?"light":"dark"}
  else if(a==="shift"){shift(Number(b.dataset.d));render()}
  else if(a==="pick"){S.sel=b.dataset.k;render()}
  else if(a==="stat"){S.stat=b.dataset.v;render()}
  else if(a==="edit")openRec(b.dataset.k);
  else if(a==="close")closeRec();
  else if(a==="mood"){d.m=Number(b.dataset.i);vRec(true)}
  else if(a==="cyc"){d.m=(d.m+Number(b.dataset.d)+5)%5;vRec(true)}
  else if(a==="tag"){const t=b.dataset.t,i=d.tags.indexOf(t);i>=0?d.tags.splice(i,1):d.tags.push(t);vRec(false)}
  else if(a==="addtag"){S.adding=true;vRec(false)}
  else if(a==="rmphoto"){d.photo="";vRec(false)}
  else if(a==="del"){
    if(!S.arm){S.arm=true;vRec(false);return}
    DB.entries[d.k]={del:1,u:Date.now()};save();pushDay(d.k);closeRec();toast("지웠어요");
  }
  else if(a==="save"){
    DB.entries[d.k]={m:d.m,n:d.n,tags:d.tags,photo:d.photo,u:Date.now()};
    if(!save()){DB.entries[d.k].photo="";if(!save()){toast("저장 공간이 부족해요");return}toast("사진은 용량 때문에 빼고 저장했어요")}
    else toast("저장했어요");
    pushDay(d.k);
    const[y,m]=parse(d.k);S.sel=d.k;S.y=y;S.m=m-1;closeRec();
  }
});
document.addEventListener("input",ev=>{if(ev.target.id==="note"){S.draft.n=ev.target.value;$("cnt").textContent=ev.target.value.length}});
document.addEventListener("keydown",ev=>{
  if(ev.target.id==="newtag"&&ev.key==="Enter"){
    ev.preventDefault();const t=ev.target.value.trim().replace(/^#/,"");
    if(t){if(!BASE.includes(t)&&!DB.tags.includes(t)){DB.tags.push(t);save();pushTags()}if(!S.draft.tags.includes(t))S.draft.tags.push(t)}
    S.adding=false;vRec(false);
  }
});
document.addEventListener("change",ev=>{
  if(ev.target.id!=="file"||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    S.draft.photo=c.toDataURL("image/jpeg",.7);vRec(false)};im.src=r.result};
  r.readAsDataURL(ev.target.files[0]);
});
/* Firebase 연결 값을 아래 FB 안에 넣으면 서버 동기화가 켜져요 */
const FB={apiKey:"",authDomain:"",projectId:"",appId:""};
let fb=null,user=null,auth=null,db=null;
try{if(FB.apiKey&&window.firebase){firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();fb=true}}catch(e){}
const col=()=>db.collection("users").doc(user.uid).collection("entries");
async function pushDay(k){if(!fb||!user)return;try{await col().doc(k).set(DB.entries[k])}catch(e){toast("서버 저장에 실패했어요. 동기화 버튼으로 다시 시도하세요")}}
async function pushTags(){if(!fb||!user)return;try{await col().doc("__tags").set({tags:DB.tags})}catch(e){}}
async function pullAll(){
  if(!fb||!user)return;
  try{
    const snap=await col().get(),remote={};
    snap.forEach(d=>{remote[d.id]=d.data()});
    ((remote.__tags&&remote.__tags.tags)||[]).forEach(t=>{if(!BASE.includes(t)&&!DB.tags.includes(t))DB.tags.push(t)});
    const up=[["__tags",{tags:DB.tags}]];
    Object.keys(DB.entries).forEach(k=>{const l=DB.entries[k],r=remote[k];if(!r||(l.u||0)>(r.u||0))up.push([k,l])});
    Object.keys(remote).forEach(k=>{if(k==="__tags")return;const l=DB.entries[k],r=remote[k];if(!l||(r.u||0)>(l.u||0))DB.entries[k]=r});
    save();
    for(let i=0;i<up.length;i+=400){const wb=db.batch();up.slice(i,i+400).forEach(([k,v])=>wb.set(col().doc(k),v));await wb.commit()}
    render();toast("동기화했어요");
  }catch(e){toast("동기화에 실패했어요")}
}
function acctCard(){
  if(!fb)return "";
  const ip='style="width:100%;margin:4px 0;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit"';
  const ps='style="margin:0 0 10px;color:var(--sub);font-size:.88rem"';
  if(user)return '<div class="card"><h3>☁️ 서버 동기화</h3><p '+ps+'>'+esc(user.email)+' 계정에 기록이 자동으로 저장돼요.</p><div style="display:flex;gap:8px"><button class="chip on" data-act="sync">지금 동기화</button><button class="chip" data-act="signout">로그아웃</button></div></div>';
  return '<div class="card"><h3>☁️ 로그인하고 기록 보관하기</h3><p '+ps+'>로그인하면 기록이 서버에 저장되어 휴대폰과 컴퓨터에서 같이 볼 수 있어요.</p><input id="em" type="email" autocomplete="email" placeholder="이메일" '+ip+'><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" '+ip+'><div style="display:flex;gap:8px;margin-top:8px"><button class="chip on" data-act="signin">로그인</button><button class="chip" data-act="signup">처음이에요 (가입)</button></div></div>';
}
if(fb){
  auth.onAuthStateChanged(u=>{
    const was=user;user=u;
    if(user&&(!was||was.uid!==user.uid))pullAll();else render();
  });
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b||!fb)return;
  const a=b.dataset.act;
  if(a==="signin"||a==="signup"){
    const email=$("em").value.trim(),pw=$("pw").value;
    if(!email||pw.length<6){toast("이메일과 6자 이상 비밀번호를 입력하세요");return}
    try{a==="signin"?await auth.signInWithEmailAndPassword(email,pw):await auth.createUserWithEmailAndPassword(email,pw)}
    catch(e){const c=e.code||"";toast(c==="auth/email-already-in-use"?"이미 가입된 이메일이에요. 로그인을 눌러주세요":/invalid-credential|wrong-password|user-not-found/.test(c)?"이메일 또는 비밀번호가 맞지 않아요":c==="auth/invalid-email"?"이메일 형식을 확인해 주세요":"실패: "+c)}
  }
  else if(a==="signout"){await auth.signOut()}
  else if(a==="sync"){pullAll()}
});
function exportData(){
  try{
    const b=new Blob([JSON.stringify(DB)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="mood-diary-"+TODAY+".json";document.body.appendChild(a);a.click();a.remove();
    toast("백업 파일을 만들었어요");
  }catch(e){toast("이 화면에서는 내보낼 수 없어요")}
}
document.addEventListener("change",ev=>{
  if(ev.target.id!=="imp"||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);if(!o||typeof o.entries!=="object")throw 0;
    let n=0;Object.keys(o.entries).forEach(k=>{if(!DB.entries[k]){DB.entries[k]=o.entries[k];n++}});
    (o.tags||[]).forEach(t=>{if(!DB.tags.includes(t))DB.tags.push(t)});
    save();render();toast(n+"개의 기록을 불러왔어요");
  }catch(e){toast("올바른 백업 파일이 아니에요")}};
  r.readAsText(ev.target.files[0]);
});
render();
</script>
</body>
</html>
