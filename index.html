<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 기분</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#FBFAFF;--card:#FFFFFF;--ink:#27243C;--sub:#908DA8;--line:#EFEDF8;--soft:#F1EFFC;--pri:#7C6CE2;
  --c0:#FFCB47;--c1:#9CD89F;--c2:#E0DFE6;--c3:#8CB8F6;--c4:#FF8C97;--eye:#3E3A4F;--sh:0 4px 18px rgba(124,108,226,.09);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1830;--card:#26233F;--ink:#EEEBFF;--sub:#A5A1C8;--line:#38345A;--soft:#322F55;--pri:#9082F0;--sh:0 4px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#1A1830;--card:#26233F;--ink:#EEEBFF;--sub:#A5A1C8;--line:#38345A;--soft:#322F55;--pri:#9082F0;--sh:0 4px 18px rgba(0,0,0,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:440px;margin:0 auto;min-height:100dvh}
.screen{padding:18px 18px 130px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.hd h1{font-size:1.6rem;line-height:1.35;margin:0;font-weight:700}
.nick{background:linear-gradient(135deg,#FF7A9A,#7C6CE2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ttl{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;margin-bottom:12px}
.ttl h1{font-size:1.15rem;margin:0;font-weight:700}
.arrow{display:inline-flex;align-items:center;justify-content:center;padding-bottom:4px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:1.3rem}
.arrow:disabled{opacity:.3;cursor:default}
.mpill{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:20px;padding:6px 8px;box-shadow:var(--sh);margin:14px 0 8px}
.mpill b{font-size:1.05rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{color:var(--sub);font-size:.82rem;padding:8px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:20px;font-weight:500;min-height:64px;font-size:.92rem}
.day svg,.day .ph{width:28px;height:28px}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--pri)}
.day.sel{background:var(--soft);box-shadow:inset 0 0 0 2px var(--pri)}
.day.today span{color:var(--pri);font-weight:700}
.day:disabled{cursor:default;color:var(--sub)}
.sum{display:flex;align-items:center;gap:14px;width:100%;background:var(--soft);border-radius:24px;padding:14px 16px;margin-top:10px}
.sum svg{width:54px;height:54px;flex:none}
.sum small{color:var(--sub);display:block;font-size:.84rem}
.sum b{font-size:1.2rem;display:block;line-height:1.3}
.sum p{margin:2px 0 0;color:var(--sub);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum>div{min-width:0;flex:1}
.chev{color:var(--pri);font-size:1.3rem;margin-left:auto;flex:none}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50vw - 202px));width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;font-size:2rem;line-height:1;text-align:center;box-shadow:0 8px 18px rgba(124,108,226,.45)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(124,108,226,.10);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--sub)}
.tabs button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:1.02rem;font-weight:700;margin:0 0 8px}
.utab{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:16px;padding:3px;margin-bottom:14px}
.utab button{padding:8px 0;border-radius:13px;color:var(--sub);text-align:center}
.utab button.on{background:var(--card);color:var(--pri);font-weight:700;box-shadow:inset 0 -2px 0 var(--pri)}
.top1{display:flex;align-items:center;justify-content:space-between}
.hap{display:flex;align-items:center;gap:14px;margin-top:6px}
.hap>svg{width:68px;height:68px;flex:none}
.hap .big{font-size:2.2rem;font-weight:700;line-height:1.1}
.hap small{color:var(--sub);font-size:.8rem;display:block}
.hap .sp{flex:1;min-width:0}
.hap .sp svg{width:100%;height:70px;display:block}
.dist{display:flex;align-items:center;gap:20px}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--card)}
.lg{flex:1;display:grid;gap:8px}
.lg div{display:flex;align-items:center;gap:8px;font-size:.9rem}
.lg i{width:11px;height:11px;border-radius:50%}
.lg b{margin-left:auto;font-weight:500}
.best{display:flex;align-items:center;gap:14px}
.best>svg{width:58px;height:58px;flex:none}
.best b{font-size:1.1rem;display:block}
.best small{color:var(--sub)}
.bub{margin-left:auto;background:var(--soft);border-radius:16px;padding:8px 12px;font-size:.8rem;max-width:130px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{background:var(--soft);border-radius:18px;padding:6px 16px;white-space:nowrap;font-weight:500;color:var(--ink)}
.chip.on{background:var(--soft);color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri);font-weight:700}
.chip.fill{background:var(--pri);color:#fff}
.srch{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;font:inherit;margin-bottom:10px}
.lst{background:var(--card);border-radius:24px;box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.ft{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 20%,var(--card))}
.ft svg{width:38px;height:38px}
.li .tx{flex:1;min-width:0}
.li small{color:var(--sub);font-size:.78rem;display:block}
.li b{display:block;line-height:1.3}
.li p{margin:0;color:var(--sub);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none}
.empty{text-align:center;color:var(--sub);padding:44px 12px}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.ov>div{max-width:440px;margin:0 auto;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
.rh{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;text-align:center}
.rh h2{font-size:1.1rem;margin:0}
.rh .ok{color:var(--pri);text-align:right;font-weight:700}
.q{text-align:center;font-size:1.3rem;font-weight:700;margin:18px 0 16px}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:20px}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px}
.pk .ft{width:100%;max-width:64px;height:auto;aspect-ratio:1;border:2px solid transparent}
.pk.on .ft{border-color:var(--pri)}
.pk .ft svg{width:70%;height:70%}
.pk small{font-size:.7rem;color:var(--sub);padding:1px 6px;border-radius:10px;white-space:nowrap}
.pk.on small{background:var(--soft);color:var(--pri);font-weight:700}
.lbl{font-weight:700;margin:18px 0 8px}
.lbl small{color:var(--sub);font-weight:400}
textarea{width:100%;min-height:92px;resize:none;border:0;border-radius:18px;background:var(--soft);color:var(--ink);font:inherit;padding:14px}
.cnt{text-align:right;color:var(--sub);font-size:.8rem}
.ip{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.photo{display:block;width:100%;border:2px dashed #CFC8F3;border-radius:18px;padding:16px;color:var(--sub);text-align:center;cursor:pointer;background:var(--soft);font-size:.9rem}
.photo img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}
.photo .i{color:var(--ink)}
.btn{width:100%;background:var(--pri);color:#fff;border-radius:999px;padding:15px;font-weight:700;font-size:1.05rem;text-align:center;margin-top:18px}
.del{display:block;margin:12px auto 0;color:var(--sub);text-decoration:underline;font-size:.9rem}
.hero{width:100%;height:250px;object-fit:cover;display:block}
.ov.dt>div{padding:0 0 24px;max-width:440px}
.dbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.dbar button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);color:#27243C;display:grid;place-items:center}
.ov.dt>div:has(img.hero) .dbar button{background-color: #e1ddfd;}
.menu{position:absolute;top:56px;right:12px;background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;z-index:3;min-width:150px}
.menu button{display:block;width:100%;padding:10px 12px;border-radius:10px}
.menu .warn{color:#E5384F;font-weight:700}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:20px 18px;box-shadow: 0 -19px 20px -16px rgba(0,0,0,.2);}
.sheet .hh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet .hh .ft{width:66px;height:66px;border-radius:22px}
.sheet .hh .ft svg{width:46px;height:46px}
.sheet small{color:var(--sub);display:block}
.sheet h2{margin:0;font-size:1.35rem}
.sheet .note{white-space:pre-wrap;margin:0 0 12px}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tg span{background:var(--soft);border-radius:16px;padding:4px 14px;font-weight:500;font-size:.9rem}
.sheet img.p{width:130px;height:96px;object-fit:cover;border-radius:12px}
.prof{display:flex;align-items:center;gap:14px;width:100%}
.prof .ft{background:var(--soft);width:56px;height:56px}
.rows{padding:4px 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ri{display:grid;place-items:center}
.row .rt{flex:1}
.row em{color:var(--sub);font-style:normal;font-size:.85rem}
.hint{text-align:center;color:var(--sub);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:22px;z-index:20;font-size:.9rem;white-space:nowrap}
</style>
</head>
<body>
<div class="app"><main class="screen" id="screen"></main></div>
<nav class="tabs" id="tabs"><div id="tabin"></div></nav>
<div class="ov" id="rec" hidden></div>
<div class="ov dt" id="det" hidden></div>

<script>
const L=["행복해요","보통이에요","그저 그래요","우울해요","힘들어요"];
const CH=["행복","보통","그저그래","우울","힘듦"];
const DOW=["일","월","화","수","목","금","토"];
const BASE=["일상","일","운동","맛있는거"];
const STATL={m:"이번 달",y:"올해",a:"전체 기간"},THEMEL={system:"시스템 설정",light:"라이트 모드",dark:"다크 모드"};
const K2="mood-diary-v2";
let DB={entries:{},tags:[]};
try{const raw=localStorage.getItem(K2);try{DB=JSON.parse(raw)||DB}catch(e){if(raw)localStorage.setItem(K2+"-corrupt",raw)}}catch(e){}
if(!DB.entries)DB.entries={};if(!DB.tags)DB.tags=[];
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem(K2,JSON.stringify(DB));return true}catch(e){return false}};
/* 기분 번호가 새 시안 기준으로 바뀌어서, 예전 기록(최고/행복/보통/우울/힘듦)을 새 번호로 옮겨요 */
const MAP=[0,0,1,3,4];
function mig(e){if(e&&typeof e.m==="number"&&e.v!==2){e.m=MAP[e.m]!==undefined?MAP[e.m]:e.m;e.v=2}return e}
let moved=false;
Object.keys(DB.entries).forEach(k=>{const e=DB.entries[k];if(e&&typeof e.m==="number"&&e.v!==2){mig(e);moved=true}});
if(moved)save();
const applyTheme=()=>{const r=document.documentElement;if(DB.theme==="light"||DB.theme==="dark")r.dataset.theme=DB.theme;else delete r.dataset.theme};
applyTheme();

const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const now=new Date(),TODAY=iso(now.getFullYear(),now.getMonth(),now.getDate());
const S={tab:"cal",y:now.getFullYear(),m:now.getMonth(),sel:TODAY,stat:DB.statDef||"m",f:-1,q:"",search:false,sub:null,draft:null,det:null,adding:false,arm:false,menu:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse=k=>k.split("-").map(Number);
const wd=k=>{const[y,m,d]=parse(k);return DOW[new Date(y,m-1,d).getDay()]};
const sdate=k=>{const[,m,d]=parse(k);return m+"월 "+d+"일 ("+wd(k)+")"};
const ldate=k=>parse(k)[0]+"년 "+sdate(k);
const ent=k=>DB.entries[k]&&typeof DB.entries[k].m==="number"?DB.entries[k]:null;
function allTags(){const s=[];BASE.concat(DB.tags).forEach(t=>{if(!s.includes(t))s.push(t)});Object.keys(DB.entries).forEach(k=>((DB.entries[k]&&DB.entries[k].tags)||[]).forEach(t=>{if(!s.includes(t))s.push(t)}));return s}
const P={cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/>',bar:'<path d="M5 20v-7M12 20V5M19 20v-10"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.6 2.2 2.3 3.5 2.3s2.5-.7 3.5-2.3M9 9.5h.01M15 9.5h.01"/>',back:'<path d="M15 5l-7 7 7 7"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',more:'<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>',cloud:'<path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.5 1.5A3.3 3.3 0 0117 18z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const ico=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';

function face(i,s){
  const st='fill="none" stroke="var(--eye)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"';
  const dot=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="var(--eye)"/>';
  const heart=x=>'<path transform="translate('+x+' 46) scale(1.25)" fill="#E5384F" d="M0 5C-9-3-9-10-4-10c2 0 3.5 1 4 3 .5-2 2-3 4-3 5 0 5 7-4 15z"/>';
  const blush='<ellipse cx="22" cy="60" rx="7" ry="4.5" fill="#FF7E8B" opacity=".45"/><ellipse cx="78" cy="60" rx="7" ry="4.5" fill="#FF7E8B" opacity=".45"/>';
  const f=[
    blush+'<path d="M28 47Q35 39 42 47M58 47Q65 39 72 47" '+st+'/><path d="M35 59Q50 77 65 59Z" fill="var(--eye)" stroke="var(--eye)" stroke-width="3" stroke-linejoin="round"/>',
    dot(35,47)+dot(65,47)+'<path d="M40 62Q50 70 60 62" '+st+'/>',
    dot(35,47)+dot(65,47)+'<path d="M41 65H59" '+st+'/>',
    dot(35,49)+dot(65,49)+'<path d="M27 40Q33 37 41 42M73 40Q67 37 59 42" '+st+' stroke-width="3.5"/><path d="M39 70Q50 60 61 70" '+st+'/>',
    blush+heart(34)+heart(66)+'<path d="M41 64Q50 72 59 64" '+st+'/>'
  ][i];
  return '<svg viewBox="0 0 100 100" width="'+s+'" height="'+s+'" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="var(--c'+i+')"/>'+f+'</svg>';
}
const tile=(i,s)=>'<span class="ft" style="--c:var(--c'+i+')">'+face(i,s||38)+'</span>';

function shift(d){
  if(S.tab==="stat"&&S.stat==="y"){S.y=Math.min(S.y+d,now.getFullYear());return}
  let m=S.m+d,y=S.y;if(m<0){m=11;y--}if(m>11){m=0;y++}
  if(y>now.getFullYear()||(y===now.getFullYear()&&m>now.getMonth()))return;
  S.m=m;S.y=y;
}
const atNow=()=>S.y===now.getFullYear()&&((S.tab==="stat"&&S.stat==="y")||S.m===now.getMonth());
const arr=(d,dis)=>'<button class="arrow" data-act="shift" data-d="'+d+'" aria-label="'+(d<0?"이전":"다음")+'"'+(dis?" disabled":"")+'>'+(d<0?"‹":"›")+'</button>';

function vCal(){
  const first=new Date(S.y,S.m,1).getDay(),n=new Date(S.y,S.m+1,0).getDate();
  let g=DOW.map(d=>'<div class="w">'+d+'</div>').join("")+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){
    const k=iso(S.y,S.m,d),e=ent(k);
    g+='<button class="day'+(k===S.sel?" sel":"")+(k===TODAY?" today":"")+'" data-act="pick" data-k="'+k+'"'+(k>TODAY?" disabled":"")+' aria-label="'+sdate(k)+(e?" "+L[e.m]:"")+'"><span>'+d+'</span>'+(e?face(e.m,28):'<i class="ph"></i>')+'<i class="dot" style="visibility:'+(e&&(e.n||e.photo)?"visible":"hidden")+'"></i></button>';
  }
  const e=ent(S.sel);
  const sum=e?'<button class="sum" data-act="open" data-k="'+S.sel+'">'+face(e.m,54)+'<div><small>'+sdate(S.sel)+'</small><b>'+L[e.m]+'!</b>'+(e.n?'<p>'+esc(e.n)+'</p>':"")+'</div><span class="chev">›</span></button>'
    :'<button class="sum" data-act="edit" data-k="'+S.sel+'"><div><small>'+sdate(S.sel)+'</small><b>아직 기록이 없어요</b><p>눌러서 오늘의 기분을 남겨보세요</p></div><span class="chev">›</span></button>';

function periodKeys(){

  if(S.stat==="m")return ks.filter(k=>k.startsWith(S.y+"-"+pad(S.m+1)+"-"));
  if(S.stat==="y")return ks.filter(k=>k.startsWith(S.y+"-"));

function trend(ks){
  const g={};
  ks.forEach(k=>{const x=S.stat==="m"?k:k.slice(0,7);(g[x]=g[x]||[]).push(4-DB.entries[k].m)});
  const xs=Object.keys(g).sort(),pts=xs.map(x=>g[x].reduce((a,b)=>a+b,0)/g[x].length);
  if(pts.length<2)return "";
  const W=150,H=70,X=i=>i/(pts.length-1)*W,Y=v=>H-8-v/4*(H-16);
  const line=pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C6CE2" stop-opacity=".3"/><stop offset="1" stop-color="#7C6CE2" stop-opacity="0"/></linearGradient></defs><path d="'+line+'L'+W+' '+H+'L0 '+H+'Z" fill="url(#ar)"/><path d="'+line+'" fill="none" stroke="#7C6CE2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

let fb=null,user=null,auth=null,db=null;
try{if(FB.apiKey&&window.firebase){firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();fb=true}}catch(e){}
const col=()=>db.collection("users").doc(user.uid).collection("entries");
async function pushDay(k){if(!fb||!user)return;try{await col().doc(k).set(DB.entries[k])}catch(e){toast("서버 저장에 실패했어요. 동기화 버튼으로 다시 시도하세요")}}
async function pushProfile(){if(!fb||!user)return;try{await col().doc("__profile").set({nick:DB.nick||"",u:DB.nickU||0})}catch(e){}}
async function pushTags(){if(!fb||!user)return;try{await col().doc("__tags").set({tags:DB.tags})}catch(e){}}
async function pullAll(){
  if(!fb||!user)return;
  try{
    const snap=await col().get(),remote={};
    snap.forEach(x=>{remote[x.id]=mig(x.data())});
    ((remote.__tags&&remote.__tags.tags)||[]).forEach(t=>{if(!BASE.includes(t)&&!DB.tags.includes(t))DB.tags.push(t)});
    const up=[["__tags",{tags:DB.tags}]];
    const rp=remote.__profile;
    if(rp&&(rp.u||0)>(DB.nickU||0)){DB.nick=rp.nick||"";DB.nickU=rp.u}
    else if(DB.nickU&&DB.nickU>((rp&&rp.u)||0))up.push(["__profile",{nick:DB.nick||"",u:DB.nickU}]);
    Object.keys(DB.entries).forEach(k=>{const l=DB.entries[k],r=remote[k];if(!r||(l.u||0)>(r.u||0))up.push([k,l])});
    Object.keys(remote).forEach(k=>{if(k.startsWith("__"))return;const l=DB.entries[k],r=remote[k];if(!l||(r.u||0)>(l.u||0))DB.entries[k]=r});
    save();
    for(let i=0;i<up.length;i+=400){const wb=db.batch();up.slice(i,i+400).forEach(([k,x])=>wb.set(col().doc(k),x));await wb.commit()}
    render();toast("동기화했어요");
  }catch(e){toast("동기화에 실패했어요")}
}
if(fb){
  auth.onAuthStateChanged(u=>{
    const was=user;user=u;
    if(user&&(!was||was.uid!==user.uid))pullAll();else render();
  });
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b||!fb)return;
  const a=b.dataset.act;
  if(a==="signin"||a==="signup"){
    const email=$("em").value.trim(),pw=$("pw").value;
    if(!email||pw.length<6){toast("이메일과 6자 이상 비밀번호를 입력하세요");return}
    try{a==="signin"?await auth.signInWithEmailAndPassword(email,pw):await auth.createUserWithEmailAndPassword(email,pw)}
    catch(e){const c=e.code||"";toast(c==="auth/email-already-in-use"?"이미 가입된 이메일이에요. 로그인을 눌러주세요":/invalid-credential|wrong-password|user-not-found/.test(c)?"이메일 또는 비밀번호가 맞지 않아요":c==="auth/invalid-email"?"이메일 형식을 확인해 주세요":"실패: "+c)}
  }
  else if(a==="signout"){await auth.signOut()}
  else if(a==="sync"){pullAll()}
});
function saveNick(){
  const v=$("nick").value.trim().slice(0,10);
  DB.nick=v;DB.nickU=Date.now();save();pushProfile();render();toast(v?"닉네임을 저장했어요":"닉네임을 지웠어요");
}
document.addEventListener("click",ev=>{if(ev.target.closest('[data-act="nick"]'))saveNick()});
function exportData(){
  try{
    const b=new Blob([JSON.stringify(DB)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="mood-diary-"+TODAY+".json";document.body.appendChild(a);a.click();a.remove();
    toast("백업 파일을 만들었어요");
  }catch(e){toast("이 화면에서는 내보낼 수 없어요")}
}
document.addEventListener("click",ev=>{if(ev.target.closest('[data-act="export"]'))exportData()});
document.addEventListener("change",ev=>{
  if(ev.target.id!=="imp"||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);if(!o||typeof o.entries!=="object")throw 0;
    let n=0;Object.keys(o.entries).forEach(k=>{if(!DB.entries[k]){DB.entries[k]=mig(o.entries[k]);n++}});
    (o.tags||[]).forEach(t=>{if(!DB.tags.includes(t))DB.tags.push(t)});
    if(o.nick&&!DB.nick){DB.nick=o.nick;DB.nickU=Date.now()}
    save();render();toast(n+"개의 기록을 불러왔어요");
  }catch(e){toast("올바른 백업 파일이 아니에요")}};
  r.readAsText(ev.target.files[0]);
});
render();
</script>
</body>
</html>
