<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--ink:#26262E;--sub:#8E8E99;--line:#ECECEF;--soft:#F5F5F7;--pri:#2F9BE6;
  --c0:#FFC94F;--c1:#9DDBB8;--c2:#D9DFE8;--c3:#91AEEB;--c4:#FF8D9E;--eye:#3E3A4F;--sh:0 2px 14px rgba(0,0,0,.06);

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1C1C20;--ink:#F2F2F5;--sub:#9A9AA6;--line:#2C2C32;--soft:#2A2A30;--pri:#5DB8F7;--sh:0 2px 14px rgba(0,0,0,.35)}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}

svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:440px;margin:0 auto;min-height:100dvh}
.screen{padding:18px 18px 130px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.hd h1{font-size:1.6rem;line-height:1.35;margin:0;font-weight:700}

.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}

.arrow{display:inline-flex;align-items:center;justify-content:center;padding-bottom:4px;width:36px;height:36px;border-radius:50%;/*display:grid;place-items:center;*/color:var(--sub);font-size:1.3rem}

.day.saturday span:first-child,
.day.sunday span:first-child{color:#999999;}

.sum{display:flex;align-items:center;gap:14px;width:100%;background:var(--soft);border-radius:24px;padding:14px 16px;margin-top:10px}

.tabs div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--sub)}

.ov>div{max-width:440px;margin:0 auto;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));position:relative}

.rh .ok{color:var(--pri);text-align:right;font-weight:700}

.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:20px}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px}
.pk .ft{width:100%;max-width:64px;height:auto;aspect-ratio:1;border:2px solid transparent}
.pk.on .ft{border-color:var(--pri)}
.pk .ft svg{width:70%;height:70%}

.pk.on small{background:var(--soft);color:var(--pri);font-weight:700}
.lbl{font-weight:700;margin:18px 0 8px}
.lbl small{color:var(--sub);font-weight:400}
textarea{width:100%;min-height:92px;resize:none;border:0;border-radius:18px;background:var(--soft);color:var(--ink);font:inherit;padding:14px}
.cnt{text-align:right;color:var(--sub);font-size:.8rem}
.ip{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.photo{display:block;width:100%;border:2px dashed #D6D6DC;border-radius:18px;padding:16px;color:var(--sub);text-align:center;cursor:pointer;background:var(--soft);font-size:.9rem}
.photo img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}
.photo .i{color:var(--ink)}
.btn{width:100%;background:var(--pri);color:#fff;border-radius:999px;padding:15px;font-weight:700;font-size:1.05rem;text-align:center;margin-top:18px}
.del{display:block;margin:12px auto 0;color:var(--sub);text-decoration:underline;font-size:.9rem}
.hero{width:100%;height:250px;object-fit:cover;display:block}
.ov.dt>div{padding:0 0 24px;max-width:440px}
.dbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.dbar button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);color:#26262E;display:grid;place-items:center}
.ov.dt>div:has(.hs) .dbar button{background-color: rgba(255,255,255,.9);}
.menu{position:absolute;top:56px;right:12px;background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;z-index:3;min-width:150px}
.menu button{display:block;width:100%;padding:10px 12px;border-radius:10px}
.menu .warn{color:#E5384F;font-weight:700}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:20px 18px;box-shadow: 0 -19px 20px -16px rgba(0,0,0,.2);}
.sheet .hh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet .hh .ft{width:66px;height:66px;border-radius:22px}
.sheet .hh .ft svg{width:46px;height:46px}
.sheet small{color:var(--sub);display:block}
.sheet h2{margin:0;font-size:1.35rem}
.sheet .note{white-space:pre-wrap;margin:0 0 12px}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tg span{background:var(--soft);border-radius:16px;padding:4px 14px;font-weight:500;font-size:.9rem}
.sheet img.p{width:130px;height:96px;object-fit:cover;border-radius:12px}
.prof{display:flex;align-items:center;gap:14px;width:100%}
.prof .ft{background:var(--soft);width:56px;height:56px}
.rows{padding:4px 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ri{display:grid;place-items:center}
.row .rt{flex:1}
.row em{color:var(--sub);font-style:normal;font-size:.85rem}
.hint{text-align:center;color:var(--sub);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:22px;z-index:20;font-size:.9rem;white-space:nowrap}
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .hp{flex:none;width:100%;height:250px;object-fit:cover;scroll-snap-align:center;background:var(--soft)}
.hc{position:absolute;right:14px;bottom:40px;background:rgba(0,0,0,.45);color:#fff;font-size:.75rem;padding:2px 10px;border-radius:12px}
.pg{display:flex;flex-wrap:wrap;gap:8px}
.pg button{padding:0;border-radius:12px;overflow:hidden;width:96px;height:96px}
.pg img{width:100%;height:100%;object-fit:cover;display:block;background:var(--soft)}
.pgr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgr .it{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--soft)}
.pgr .it img{width:100%;height:100%;object-fit:cover;display:block}
.pgr .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:1rem;line-height:1}
.pgr .add{aspect-ratio:1;border:2px dashed #D6D6DC;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);background:var(--soft);cursor:pointer;text-align:center;font-size:.8rem}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,12,18,.94);overflow:hidden}
.lbi{position:absolute;inset:0;display:grid;place-items:center}
.lbi img{display:block;width:100%;height:100%;object-fit:contain}
.lbx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:31;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);color:#26262E;font-size:1.1rem;text-align:center}
.lbn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:31;background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;padding:4px 14px;border-radius:14px;white-space:nowrap}
@media (hover:hover){.chips{scrollbar-width:thin;cursor:grab}.chips.drag{cursor:grabbing;user-select:none}}
.chips .chip{flex:none}
.screen.sw{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sbody.sl{animation:swl .3s ease-out}
.sbody.sr{animation:swr .3s ease-out}
@keyframes swl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.hap>svg{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 70%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
.day,.chip,.btn,.li,.sum,.fab,.row,.pk,.arrow,.ic,.tabs button{transition:transform .12s ease,background-color .15s ease}
.day:active,.chip:active,.btn:active,.li:active,.sum:active,.fab:active,.row:active,.pk:active,.arrow:active,.ic:active,.tabs button:active{transform:scale(.95)}
.lb:not([hidden]){animation:fin .2s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
.toast{animation:fin .2s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.utab{position:relative}

.pager{overflow:hidden;margin:-8px -18px -20px}
.track{display:flex;will-change:transform}
.panel{flex:0 0 100%;min-width:0;padding:8px 18px 20px}

#note{font-size:1.2rem;line-height:1.5}
.sheet .note{font-size:1.25rem;line-height:1.55}
.li p,.sum p{font-size:1rem}
.chipw{display:inline-flex;align-items:stretch}
.chipw .chip{border-radius:18px 0 0 18px;padding-right:8px}
.cx{background:var(--soft);color:var(--sub);padding:0 12px 0 2px;border-radius:0 18px 18px 0;font-size:1.05rem;line-height:1}
.chipw .chip.on{box-shadow:inset 2px 0 0 var(--pri),inset 0 2px 0 var(--pri),inset 0 -2px 0 var(--pri)}

.sws{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:4px 2px 8px}
.cw{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);position:relative;display:grid;place-items:center;font-size:.85rem;font-weight:700;padding:0;overflow:hidden;color:var(--ink)}
.cw.on{outline:2px solid var(--ink);outline-offset:2px}
.cw.cust{background:conic-gradient(#f44,#fc4,#4d4,#4cf,#44f,#f4c,#f44);border:0}

</style>

<div class="app"><main class="screen" id="screen"></main></div>
<nav class="tabs" id="tabs"><div id="tabin"></div></nav>
<div class="ov" id="rec" hidden></div>
<div class="ov dt" id="det" hidden></div>

<script>
const L=["행복해요","기분좋아요","보통이에요","힘들어요","화나요"];
const CH=["행복","좋음","보통","힘듦","화남"];
const DOW=["일","월","화","수","목","금","토"];
const BASE=["일상","일","운동","맛있는거"];
const STATL={m:"이번 달",y:"올해",a:"전체 기간"},THEMEL={system:"시스템 설정",light:"라이트 모드",dark:"다크 모드"};
const K2="mood-diary-v2";
let DB={entries:{},tags:[]};
try{const raw=localStorage.getItem(K2);try{DB=JSON.parse(raw)||DB}catch(e){if(raw)localStorage.setItem(K2+"-corrupt",raw)}}catch(e){}
if(!DB.entries)DB.entries={};if(!DB.tags)DB.tags=[];
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem(K2,JSON.stringify(DB));return true}catch(e){return false}};
/* 기분 번호가 새 시안 기준으로 바뀌어서, 예전 기록(최고/행복/보통/우울/힘듦)을 새 번호로 옮겨요 */
const MAP=[0,0,1,3,4];
function mig(e){if(e&&typeof e.m==="number"&&e.v!==2){e.m=MAP[e.m]!==undefined?MAP[e.m]:e.m;e.v=2}return e}
let moved=false;
Object.keys(DB.entries).forEach(k=>{const e=DB.entries[k];if(e&&typeof e.m==="number"&&e.v!==2){mig(e);moved=true}});
if(moved)save();
const applyTheme=()=>{const r=document.documentElement;if(DB.theme==="light"||DB.theme==="dark")r.dataset.theme=DB.theme;else delete r.dataset.theme};
applyTheme();

const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const now=new Date(),TODAY=iso(now.getFullYear(),now.getMonth(),now.getDate());
const S={tab:"cal",y:now.getFullYear(),m:now.getMonth(),sel:TODAY,stat:DB.statDef||"m",f:-1,q:"",search:false,sub:null,draft:null,det:null,adding:false,arm:false,menu:false};
const $=id=>document.getElementById(id);

function periodKeys(){
  const ks=Object.keys(DB.entries).filter(ent);
  if(S.stat==="m")return ks.filter(k=>k.startsWith(S.y+"-"+pad(S.m+1)+"-"));
  if(S.stat==="y")return ks.filter(k=>k.startsWith(S.y+"-"));
  return ks;
}
function trendPts(ks){
  const g={};
  ks.forEach(k=>{const x=S.stat==="m"?k:k.slice(0,7);(g[x]=g[x]||[]).push(4-DB.entries[k].m)});
  return Object.keys(g).sort().map(x=>g[x].reduce((a,b)=>a+b,0)/g[x].length);
}
function trendD(pts,k){
  const W=150,H=70,X=i=>i/(pts.length-1)*W,Y=v=>{const r=H-8-v/4*(H-16),f=H/2;return f+(r-f)*k};
  const line=pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join("");
  return {line:line,area:line+"L"+W+" "+H+"L0 "+H+"Z"};
}
function trend(ks,fresh,mode){
  const pts=trendPts(ks);if(pts.length<2)return "";
  const d=trendD(pts,fresh?0:1);
  return '<svg class="tr" data-m="'+mode+'" data-p="'+pts.join(",")+'" viewBox="0 0 150 70" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F9BE6" stop-opacity=".3"/><stop offset="1" stop-color="#2F9BE6" stop-opacity="0"/></linearGradient></defs><path class="ta" d="'+d.area+'" fill="url(#ar)"/><path class="tl" d="'+d.line+'" fill="none" stroke="#2F9BE6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}
const played={};
function playPanel(mode){
  if(S.tab!=="stat"||played[mode])return;
  const pv=document.querySelector('.pv[data-m="'+mode+'"]'),tr=document.querySelector('svg.tr[data-m="'+mode+'"]');
  if(!pv&&!tr)return;
  played[mode]=true;
  const target=pv?Number(pv.dataset.v):0,pts=tr?tr.dataset.p.split(",").map(Number):null;
  const draw=e=>{
    if(pv)pv.textContent=Math.round(target*e);
    if(tr){const d=trendD(pts,e);tr.querySelector(".tl").setAttribute("d",d.line);tr.querySelector(".ta").setAttribute("d",d.area)}
  };
  if(!window.requestAnimationFrame||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){draw(1);return}
  const t0=performance.now(),D=1100;
  const step=t=>{const q=Math.min(1,(t-t0)/D),e=1-Math.pow(1-q,3);draw(e);if(q<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

let donutPlayed=false;
function animDonut(){
  if(donutPlayed||S.tab!=="stat")return;
  const el=document.querySelector('.donut[data-c][data-m="'+S.stat+'"]');if(!el)return;
  const c=el.dataset.c.split(",").map(Number),tot=c.reduce((a,b)=>a+b,0);if(!tot)return;
  donutPlayed=true;
  const seg=A=>{let acc=0;const out=[];c.forEach((v,i)=>{const a=acc/tot*360;acc+=v;const b=Math.min(acc/tot*360,A);if(b>a)out.push("var(--c"+i+") "+a+"deg "+b+"deg")});return A>=359.9?out.join(","):out.concat(["var(--soft) "+A+"deg 360deg"]).join(",")};
  const done=()=>{el.style.background="conic-gradient("+seg(360)+")"};
  if(!window.requestAnimationFrame||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){done();return}
  const t0=performance.now(),D=1000;
  const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.style.background="conic-gradient("+seg(360*e)+")";if(p<1)requestAnimationFrame(step);else done()};
  requestAnimationFrame(step);
}

let pg=null;
document.addEventListener("pointerdown",ev=>{
  if(S.tab!=="stat"||!ev.target.closest||!ev.target.closest("#screen"))return;
  if(ev.pointerType==="mouse"&&ev.button!==0)return;
  const tr=document.querySelector(".track");if(!tr)return;
  pg={x:ev.clientX,y:ev.clientY,id:ev.pointerId,i:PM.indexOf(S.stat),W:tr.parentElement.clientWidth||360,on:false,lx:ev.clientX,lt:performance.now(),v:0};
});
document.addEventListener("pointermove",ev=>{
  if(!pg||ev.pointerId!==pg.id)return;
  const dx=ev.clientX-pg.x,dy=ev.clientY-pg.y;
  if(!pg.on){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2)pg.on=true;else return}
  cmoved=true;
  const t=performance.now(),dt=t-pg.lt;if(dt>0)pg.v=pg.v*.5+(ev.clientX-pg.lx)/dt*.5;pg.lx=ev.clientX;pg.lt=t;
  const x=((pg.i===0&&dx>0)||(pg.i===2&&dx<0))?dx*.35:dx;
  const tr=document.querySelector(".track"),ui=document.querySelector(".ui");
  if(tr){tr.style.transition="none";tr.style.transform="translate3d(calc("+(-pg.i*100)+"% + "+x+"px),0,0)"}
  if(ui){ui.style.transition="none";ui.style.transform="translateX("+((pg.i-x/pg.W)*100)+"%)"}
  const near=Math.max(0,Math.min(2,Math.round(pg.i-x/pg.W)));
  document.querySelectorAll(".utab button").forEach((b,i)=>b.classList.toggle("on",i===near));
});
function pgEnd(ev,cancel){
  if(!pg||ev.pointerId!==pg.id)return;
  const g=pg;pg=null;if(!g.on)return;
  const dx=ev.clientX-g.x,fast=Math.abs(g.v)>.45;let n=g.i;
  if(!cancel&&(Math.abs(dx)>g.W*.22||fast)){const dir=fast?(g.v<0?1:-1):(dx<0?1:-1);n=Math.max(0,Math.min(2,g.i+dir))}
  S.stat=PM[n];pgSet(n,true);
}

  const c=ev.target.closest&&ev.target.closest(".chips");
  if(!c||c.scrollWidth<=c.clientWidth||Math.abs(ev.deltaY)<=Math.abs(ev.deltaX))return;
  const max=c.scrollWidth-c.clientWidth;

/* 사진: 원본 파일 그대로 IndexedDB에 저장 (o:ID = 원본, t:ID = 목록용 작은 미리보기) */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let idb=null;
function idbOpen(){return idb||(idb=new Promise((res,rej)=>{const r=indexedDB.open("mood-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function pPut(k,v){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction("p","readwrite");t.objectStore("p").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function pGet(k){const d=await idbOpen();return new Promise((res,rej)=>{const r=d.transaction("p").objectStore("p").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const URLS={};
const b2u=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function pDel(k){try{const d=await idbOpen();delete URLS[k];return new Promise(res=>{const t=d.transaction("p","readwrite");t.objectStore("p").delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}
async function pUrl(k){if(URLS[k])return URLS[k];try{const b=await pGet(k);if(!b)return "";const u=await b2u(b);if(k[0]==="t")URLS[k]=u;return u}catch(e){return ""}}
const plist=e=>e?(e.photos||[]).map(id=>({id:id})).concat((e.pd||[]).map(u=>({l:u}))).concat(e.photo?[{l:e.photo}]:[]):[];
const pimg=(p,kind,cls,alt)=>p.l?'<img'+(cls?' class="'+cls+'"':"")+' src="'+p.l+'" alt="'+alt+'">':'<img'+(cls?' class="'+cls+'"':"")+' data-p="'+kind+':'+p.id+'" alt="'+alt+'">';
function d2b(u){const a=u.split(","),m=/:(.*?);/.exec(a[0])[1],bin=atob(a[1]),x=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)x[i]=bin.charCodeAt(i);return new Blob([x],{type:m})}
async function mkThumb(f){
  try{
    const u=await b2u(f);
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
    const sc=Math.min(1,320/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.8));
  }catch(e){return null}
}
async function mkOpt(f,strict){
  const mem=async()=>new Blob([await f.arrayBuffer()],{type:f.type||"image/jpeg"});
  try{
    const u=await b2u(f);
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
    const m0=Math.max(im.naturalWidth,im.naturalHeight);
    if(m0<=2560&&f.size<=1500000){return strict?await mem():f}
    const sc=Math.min(1,2560/m0),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));
    return b&&b.size<f.size?b:(strict?await mem():f);
  }catch(e){if(strict)throw e;return f}
}
async function toDataUrl(f,max,q){
  const u=await b2u(f);
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
  const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
const isHeic=f=>/heic|heif/i.test(f.type||"")||/\.(heic|heif)$/i.test(f.name||"");

async function hyd(){

  for(const im of ims){
    if(im.getAttribute("src"))continue;
    const key=im.dataset.p;let u=await pUrl(key);

try{new MutationObserver(()=>{if(!hq){hq=1;setTimeout(()=>{hq=0;hyd()},30)}}).observe(document.body,{childList:true,subtree:true})}catch(e){}

let saving=false;
async function saveRec(){
  if(saving)return;saving=true;
  const d=S.draft;let ids=[],pd=[],fallback=false;
  try{
    for(const p of d.photos){
      if(p.file){
        await pPut("o:"+p.id,p.file);
        const back=await pGet("o:"+p.id);if(!back||!back.size)throw new Error("verify");
        const t=await mkThumb(p.file);if(t)await pPut("t:"+p.id,t);
      }

    }
  }catch(e){fallback=true}
  if(fallback){

    catch(e){saving=false;toast("사진을 저장하지 못했어요. 다른 사진으로 다시 시도해 주세요");return}
  }

  const en={m:d.m,n:d.n,tags:d.tags,photos:ids,u:Date.now(),v:2,f:d.f,c:d.c};
  if(pd.length)en.pd=pd;

}

    q+=46+nl+el+cl;
  }
  return out;
}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function exportZip(){
  toast("백업 파일을 만드는 중이에요...");
  try{
    const files=[],seen={};let pc=0,miss=0;
    for(const k of Object.keys(DB.entries)){
      const e=DB.entries[k];
      for(const id of ((e&&e.photos)||[])){
        if(seen[id])continue;seen[id]=1;
        let b=null;try{b=await pGet("o:"+id)}catch(x){}
        if(b){files.push({name:"photos/"+id+".jpg",blob:b});pc++}else miss++;
      }
    }
    files.unshift({name:"data.json",blob:new Blob([JSON.stringify(DB)],{type:"application/json"})});
    dl(await zipBuild(files),"mood-diary-"+TODAY+".zip");
    toast("백업 완료 · 사진 "+pc+"장"+(miss?" (이 기기에 없는 사진 "+miss+"장 제외)":""));
  }catch(e){toast("백업 파일을 만들지 못했어요")}
}
async function importAny(f){
  let o,z=null;
  if(/\.zip$/i.test(f.name)){z=await zipRead(f);if(!z["data.json"])throw 0;o=JSON.parse(await z["data.json"].text())}
  else o=JSON.parse(await f.text());
  if(!o||typeof o.entries!=="object")throw 0;
  toast("불러오는 중이에요...");
  let n=0,pc=0;
  for(const k of Object.keys(o.entries)){
    const src=mig(o.entries[k]);if(!src||typeof src!=="object"||src.del)continue;
    const local=DB.entries[k],isNew=!local;
    if(!isNew&&!(ent(k)&&!(local.photos&&local.photos.length)))continue;
    const okIds=[];
    if(z&&Array.isArray(src.photos)){
      for(const id of src.photos){
        const bl=z["photos/"+id+".jpg"];if(!bl)continue;
        let have=null;try{have=await pGet("o:"+id)}catch(x){}
        if(!have){const b=new Blob([bl],{type:"image/jpeg"});await pPut("o:"+id,b);const t=await mkThumb(b);if(t)await pPut("t:"+id,t);pc++}
        okIds.push(id);
      }
    }
    if(isNew){const e=Object.assign({},src);if(okIds.length)e.photos=okIds;else delete e.photos;DB.entries[k]=e;n++}
    else if(okIds.length)local.photos=okIds;
  }
  (o.tags||[]).forEach(t=>{if(!DB.tags.includes(t))DB.tags.push(t)});
  if(o.nick&&!DB.nick){DB.nick=o.nick;DB.nickU=Date.now()}
  save();softRender();toast(n+"개 기록, 사진 "+pc+"장을 불러왔어요");
}
document.addEventListener("click",ev=>{
  if(!ev.target.closest)return;
  if(ev.target.closest('[data-act="export"]'))exportData();
  else if(ev.target.closest('[data-act="exportzip"]'))exportZip();
});
document.addEventListener("change",ev=>{
  if(ev.target.id!=="imp"||!ev.target.files[0])return;
  const f=ev.target.files[0];ev.target.value="";
  importAny(f).catch(()=>toast("올바른 백업 파일이 아니에요"));
});
/* 예전 방식(기록 데이터 안에 들어 있던) 사진을 새 사진 저장소로 옮겨요 */
let migBusy=false;
async function migratePhotos(){
  if(migBusy)return;migBusy=true;
  try{
    let ch=false;
    for(const k of Object.keys(DB.entries)){
      const e=DB.entries[k];
      if(!e)continue;
      const urls=[];
      if(typeof e.photo==="string"&&e.photo.indexOf("data:")===0)urls.push(e.photo);
      (e.pd||[]).forEach(u=>{if(typeof u==="string"&&u.indexOf("data:")===0)urls.push(u)});
      if(!urls.length)continue;
      try{
        const ids=[];
        for(const u of urls){const id=uid(),b=d2b(u);await pPut("o:"+id,b);const t=await mkThumb(b);if(t)await pPut("t:"+id,t);ids.push(id)}
        e.photos=(e.photos||[]).concat(ids);delete e.photo;delete e.pd;ch=true;
      }catch(x){}
    }
    if(ch){save();softRender()}
  }catch(x){}
  migBusy=false;
}
render();
migratePhotos();
